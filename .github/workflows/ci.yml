name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.14.7"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  container:
    name: Docker amd64 and arm64
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp config.example.toml config.toml
          cp config.dev.example.toml config.dev.toml
          printf 'DISCORD_TOKEN=not-a-real-token\n' > .env
          printf 'DISCORD_TOKEN_DEV=not-a-real-token\n' > .env.dev
          docker compose config --quiet
          docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker build --tag charlotte-ci .
      - run: docker run --rm --entrypoint python charlotte-ci -c "import charlotte"
      - name: Verify amd64 healthcheck runtime
        run: >-
          docker run --rm --entrypoint python charlotte-ci -c
          "import json, time; from charlotte.health import HEALTH_PATH;
          HEALTH_PATH.write_text(json.dumps({'ready': True, 'heartbeat_at': time.time()}));
          from charlotte.healthcheck import main; raise SystemExit(main())"
      - run: docker run --rm --entrypoint ffmpeg charlotte-ci -version
      - run: docker run --rm --entrypoint node charlotte-ci --version
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id charlotte-ci -u)" != "0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build loadable arm64 runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: charlotte-ci-arm64
          cache-from: type=gha,scope=arm64-runtime
          cache-to: type=gha,mode=max,scope=arm64-runtime
      - name: Verify arm64 runtime under QEMU
        run: |
          docker run --rm --platform linux/arm64 --entrypoint python charlotte-ci-arm64 -c "import charlotte"
          docker run --rm --platform linux/arm64 --entrypoint python charlotte-ci-arm64 -c "import json, time; from charlotte.health import HEALTH_PATH; HEALTH_PATH.write_text(json.dumps({'ready': True, 'heartbeat_at': time.time()})); from charlotte.healthcheck import main; raise SystemExit(main())"
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg charlotte-ci-arm64 -version
          docker run --rm --platform linux/arm64 --entrypoint node charlotte-ci-arm64 --version
          test "$(docker run --rm --platform linux/arm64 --entrypoint id charlotte-ci-arm64 -u)" != "0"
          test "$(docker image inspect charlotte-ci-arm64 --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
