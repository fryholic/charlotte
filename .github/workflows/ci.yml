name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.14.7"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  container:
    name: Docker amd64 and arm64
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp config.example.toml config.toml
          cp config.dev.example.toml config.dev.toml
          printf 'DISCORD_TOKEN=not-a-real-token\n' > .env
          printf 'DISCORD_TOKEN_DEV=not-a-real-token\n' > .env.dev
          docker compose config --quiet
          docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker build --tag charlotte-ci .
      - run: docker run --rm --entrypoint python charlotte-ci -c "import charlotte"
      - run: docker run --rm --entrypoint ffmpeg charlotte-ci -version
      - run: docker run --rm --entrypoint node charlotte-ci --version
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id charlotte-ci -u)" != "0"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
