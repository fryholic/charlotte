services:
  charlotte:
    build:
      context: .
    image: charlotte:production
    container_name: charlotte-bot
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DEV: "false"
      CHARLOTTE_CONFIG: /app/config.toml
      MAX_QUEUE_TRACKS: ${MAX_QUEUE_TRACKS:-0}
      MAX_QUEUED_UPLOAD_BYTES: ${MAX_QUEUED_UPLOAD_BYTES:-0}
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
