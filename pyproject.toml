[project]
name = "charlotte"
version = "0.1.0"
description = "A Discord music and custom emoji bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
authors = [{ name = "fryholic" }]
dependencies = [
    "discord-py[voice]>=2.7.0,<3",
    "mutagen>=1.47,<2",
    "python-dotenv>=1.1,<2",
    "yt-dlp==2026.08.19",
    "yt-dlp-ejs>=0.8,<1",
]

[project.scripts]
charlotte = "charlotte.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charlotte"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
